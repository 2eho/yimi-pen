[project]
name = "yimi-pen-hardware-tests"
version = "0.1.0"
description = "Host-side EVT-0 hardware acceptance tests for Yimi Pen"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyserial>=3.5,<4",
  "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.uv]
link-mode = "copy"
