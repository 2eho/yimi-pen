[package]
name = "yimi-platform-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Auditable C ABI boundary for Yimi Pen board ports"
build = "build.rs"

[features]
default = []
host-mock = []

[dependencies]
yimi-fw-contract = { path = "../yimi-fw-contract" }

[build-dependencies]
cc = "=1.4.0"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
