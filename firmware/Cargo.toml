[workspace]
members = [
  "crates/yimi-fw-contract",
  "crates/yimi-snapshot-core",
  "crates/yimi-device-link-core",
  "crates/yimi-runtime-core",
  "crates/yimi-platform-ffi",
  "crates/yimi-fw-host",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/2eho/yimi-pen"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
